name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install development dependencies (lockfile only, no install scripts)
        # Before network isolation. Only the guard's parser (see ADR-RN-005); packages/ has no dependencies.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolation check rejects a connected environment (negative control)
        # The same check that guards the offline run must fail here, where the network is
        # reachable, and for the expected reason.
        run: |
          if out=$(sudo env "PATH=$PATH" tools/ci/offline-checks.sh --isolation-only 2>&1); then
            echo "$out"
            echo "::error::the isolation check passed outside a network namespace" >&2
            exit 1
          fi
          echo "$out"
          grep -q 'interfaces other than loopback present' <<<"$out"
      - name: Isolation script fails closed (tests)
        # Simulates a failing `ip`, a failing namespace, a dead positive control, a reachable
        # address and failing check stages; each must fail the isolation script.
        run: tools/ci/offline-checks.test.sh
      - name: Offline checks (syntax, tests, independent Python reference)
        # A new network namespace with loopback only, so the checks cannot reach the network while
        # the runner keeps its own connection. The script proves isolation (structure, a positive
        # loopback control, negative probes), then runs the checks as the runner user.
        run: sudo env "PATH=$PATH" unshare --net -- tools/ci/offline-checks.sh

  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install development dependencies (lockfile only, no install scripts)
        # Before network isolation. Only the guard's parser (see ADR-RN-005); packages/ has no dependencies.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository guards
        run: node tools/guards/run.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
